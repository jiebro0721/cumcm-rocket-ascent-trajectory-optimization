<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F4E79"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E6B4E"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="white"/>
  <text x="450" y="36" text-anchor="middle" font-family="SimSun" font-size="20" font-weight="bold" fill="#111">平面内受力分析与坐标系定义</text>

  <!-- 左图：赤道平面受力模型 -->
  <g transform="translate(20 50)">
    <text x="220" y="20" text-anchor="middle" font-family="SimHei" font-size="16" fill="#111">(a) 横向坐标系与受力（赤道平面）</text>
    <!-- 地球 -->
    <circle cx="220" cy="340" r="160" fill="#e8edf3" stroke="#7a8ea8" stroke-width="1.5"/>
    <text x="220" y="520" text-anchor="middle" font-family="SimHei" font-size="13" fill="#555">地球</text>
    <!-- 地心 -->
    <circle cx="220" cy="340" r="3" fill="#555"/>
    <text x="205" y="330" font-family="SimSun" font-size="13" fill="#555">O</text>
    <!-- 火箭位置（在圆边缘上方） -->
    <circle cx="330" cy="235" r="7" fill="#1F4E79"/>
    <text x="330" y="212" text-anchor="middle" font-family="SimHei" font-size="13" fill="#1F4E79">火箭</text>
    <!-- r 向量 -->
    <line x1="220" y1="340" x2="330" y2="235" stroke="#333" stroke-width="1.8"/>
    <text x="255" y="305" font-family="SimSun" font-size="14" fill="#333">r</text>
    <!-- 单位向量 r̂ -->
    <line x1="330" y1="235" x2="405" y2="160" stroke="#1F4E79" stroke-width="1.4"/>
    <text x="415" y="158" font-family="SimSun" font-size="13" fill="#1F4E79">r̂</text>
    <!-- 单位向量 t̂ -->
    <line x1="330" y1="235" x2="290" y2="280" stroke="#1F4E79" stroke-width="1.4"/>
    <text x="270" y="295" font-family="SimSun" font-size="13" fill="#1F4E79">t̂</text>
    <!-- 当地水平面虚线 -->
    <line x1="230" y1="180" x2="430" y2="290" stroke="#999" stroke-width="0.9" stroke-dasharray="6 4"/>
    <text x="108" y="200" font-family="SimHei" font-size="12" fill="#999">当地水平面</text>
    <!-- 速度 v -->
    <line x1="330" y1="235" x2="455" y2="270" stroke="#2E6B4E" stroke-width="2.2" marker-end="url(#arrow-green)"/>
    <text x="462" y="285" font-family="SimSun" font-size="15" fill="#2E6B4E">v</text>
    <!-- 推力 T（沿 φ 角，略高于当地水平） -->
    <line x1="330" y1="235" x2="470" y2="215" stroke="#b23c3c" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="478" y="212" font-family="SimSun" font-size="15" fill="#b23c3c">T</text>
    <!-- 阻力 D（与 v 反向，沿水平面左下方） -->
    <line x1="330" y1="235" x2="245" y2="252" stroke="#8a6d3b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="222" y="252" font-family="SimSun" font-size="14" fill="#8a6d3b">D</text>
    <!-- 重力 g（指向地心） -->
    <line x1="330" y1="235" x2="280" y2="285" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="255" y="305" font-family="SimSun" font-size="14" fill="#555">g</text>
    <!-- γ 角弧 -->
    <path d="M 350 285 A 75 75 0 0 0 380 268" fill="none" stroke="#2E6B4E" stroke-width="1.2"/>
    <text x="385" y="300" font-family="SimSun" font-size="14" fill="#2E6B4E">γ</text>
    <!-- φ 角弧 -->
    <path d="M 385 210 A 60 60 0 0 0 365 200" fill="none" stroke="#b23c3c" stroke-width="1.2"/>
    <text x="408" y="195" font-family="SimSun" font-size="14" fill="#b23c3c">φ</text>
    <!-- 角注释 -->
    <text x="140" y="415" font-family="SimHei" font-size="12" fill="#666">γ：速度与水平面夹角（飞行路径角）</text>
    <text x="140" y="435" font-family="SimHei" font-size="12" fill="#666">φ：推力与水平面夹角（俯仰角）</text>
  </g>

  <!-- 右图：坐标系与阶段 -->
  <g transform="translate(500 60)">
    <text x="190" y="18" text-anchor="middle" font-family="SimHei" font-size="16" fill="#111">(b) 三个阶段的控制输入</text>
    <!-- 阶段1 -->
    <rect x="10" y="55" width="360" height="130" fill="#f7f9fc" stroke="#ccc" stroke-width="1"/>
    <text x="190" y="80" text-anchor="middle" font-family="SimHei" font-size="14" fill="#111">阶段Ⅰ：垂直起飞 + 程序转弯</text>
    <line x1="40" y1="105" x2="340" y2="105" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="40" y="135" font-family="SimSun" font-size="12" fill="#333">T = Fmax1（恒定）</text>
    <text x="40" y="155" font-family="SimSun" font-size="12" fill="#333">φ(t) = 90° − 0.4°/s·(t − 10s)</text>
    <text x="40" y="175" font-family="SimSun" font-size="12" fill="#666">终止：一子级推进剂耗尽 t₁</text>
    <!-- 阶段2 -->
    <rect x="10" y="205" width="360" height="110" fill="#f7f9fc" stroke="#ccc" stroke-width="1"/>
    <text x="190" y="230" text-anchor="middle" font-family="SimHei" font-size="14" fill="#111">阶段Ⅱ：无动力滑行</text>
    <line x1="40" y1="253" x2="340" y2="253" stroke="#8a6d3b" stroke-width="1.5"/>
    <text x="40" y="280" font-family="SimSun" font-size="12" fill="#333">T = 0（重力转向）</text>
    <text x="40" y="300" font-family="SimSun" font-size="12" fill="#666">终止：滑行时间 t_c 到期</text>
    <!-- 阶段3 -->
    <rect x="10" y="335" width="360" height="130" fill="#fdf7f7" stroke="#ccc" stroke-width="1"/>
    <text x="190" y="360" text-anchor="middle" font-family="SimHei" font-size="14" fill="#b23c3c">阶段Ⅲ：二子级入轨修正</text>
    <line x1="40" y1="383" x2="340" y2="383" stroke="#b23c3c" stroke-width="1.5"/>
    <text x="40" y="410" font-family="SimSun" font-size="12" fill="#333">Q1: φ = γ（沿速度），T = Fmax2</text>
    <text x="40" y="430" font-family="SimSun" font-size="12" fill="#333">Q2: φ = φ₀ + k·(t − t₂)</text>
    <text x="40" y="450" font-family="SimSun" font-size="12" fill="#333">Q4: T = σ(t)·Fmax2，σ ∈ [0.6, 1]</text>
  </g>

  <!-- 底部说明 -->
  <text x="450" y="605" text-anchor="middle" font-family="SimHei" font-size="12" fill="#555">注：γ 为飞行路径角（速度与当地水平面夹角），φ 为推力俯仰角（推力与当地水平面夹角）</text>
</svg>
